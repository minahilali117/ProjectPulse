name: White Box Test CI

on:
  push:
    branches:
      - workflow-TESTING-BRANCH
  pull_request:
    branches:
      - workflow-TESTING-BRANCH

jobs:
  whitebox-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Client Dependencies
      working-directory: ./client
      run: npm install
  
    - name: Start Client 
      working-directory: ./client
      run: npm run dev &
        sleep 10

    - name: Start Server
      working-directory: ./server
      run: |
        npm start &
        sleep 10

    - name: Run Whitebox Tests
      run: bash tests/whitebox.sh
