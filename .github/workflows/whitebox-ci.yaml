name: White Box Test CI

on:
  push:
    branches:
      - workflow-TESTING-BRANCH
  pull_request:
    branches:
      - workflow-TESTING-BRANCH

jobs:
  whitebox-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Server Dependencies
      working-directory: ./server
      run: npm install

    - name: Start Backend (Express) in Background
      working-directory: ./server
      run: npm start &

    - name: Wait for Backend to be Ready (Port 8800)
      run: |
        for i in {1..10}; do
          echo "⌛ Checking if backend is up..."
          curl -s -f http://localhost:8800/api/users && break
          echo "🔁 Backend not ready yet, retrying in 3s..."
          sleep 3
        done

    - name: Run Whitebox API Tests
      run: bash tests/whitebox.sh
