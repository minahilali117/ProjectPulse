name: White Box Test CI

on:
  push:
    branches:
      - workflow-TESTING-BRANCH
  pull_request:
    branches:
      - workflow-TESTING-BRANCH

jobs:
  whitebox-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Client Dependencies
      working-directory: ./client
      run: npm install

    - name: Install Server Dependencies
      working-directory: ./server
      run: npm install

    - name: Start Frontend (Vite) in Background
      working-directory: ./client
      run: npm run dev &

    - name: Start Backend in Background
      working-directory: ./server
      run: npm start &

    - name: Wait for Backend to be Ready
      run: |
        for i in {1..10}; do
          echo "Checking if backend is up..."
          curl -s -f http://localhost:5000/api/users && break
          echo "Backend not ready. Retrying in 3s..."
          sleep 3
        done

    - name: Run Whitebox Tests
      run: bash tests/whitebox.sh
